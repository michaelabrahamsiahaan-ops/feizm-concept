<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 201" preserveAspectRatio="none">
  <defs>
    <radialGradient id="warm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="10" gradientTransform="matrix(-56.779 -7.05 1.9847 -15.939 662.93 182.5)">
      <stop offset="0" stop-color="#F25A29" stop-opacity="1"/>
      <stop offset="0.30288" stop-color="#C36623" stop-opacity="1"/>
      <stop offset="0.47716" stop-color="#924D1B" stop-opacity="0.75"/>
      <stop offset="0.65144" stop-color="#623312" stop-opacity="0.5"/>
      <stop offset="0.82572" stop-color="#311A09" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#393939" stop-opacity="0"/>
      <stop offset="0.097015" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Figma's NOISE effect on this layer: MONOTONE, color #393939, alpha 0.2, size 1, density 1.
         feTurbulence drives per-pixel alpha (true grain, not a flat tint); feColorMatrix holds RGB
         constant at that gray and scales the turbulence's own alpha channel down to the 0.2 max. -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.2247  0 0 0 0 0.2247  0 0 0 0 0.2247  0 0 0 0.2 0"/>
    </filter>
  </defs>
  <rect width="716" height="201" fill="url(#warm)"/>
  <rect width="716" height="201" fill="url(#dark)"/>
  <rect width="716" height="201" filter="url(#grain)"/>
</svg>
