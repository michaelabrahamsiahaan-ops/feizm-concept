<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298 84" preserveAspectRatio="none">
  <defs>
    <radialGradient id="warm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="10" gradientTransform="matrix(-29.501 -2.065 0.13377 -8.2608 290.03 93.1)">
      <stop offset="0" stop-color="#F25A29" stop-opacity="1"/>
      <stop offset="0.30288" stop-color="#C36623" stop-opacity="1"/>
      <stop offset="0.47716" stop-color="#924D1B" stop-opacity="0.75"/>
      <stop offset="0.65144" stop-color="#623312" stop-opacity="0.5"/>
      <stop offset="0.82572" stop-color="#311A09" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Same NOISE effect as overlay-expanded.svg (Figma: MONOTONE, #393939, alpha 0.2, size 1, density 1), present on the Default/collapsed variant too — confirmed via figma-cli eval. -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.2247  0 0 0 0 0.2247  0 0 0 0 0.2247  0 0 0 0.2 0"/>
    </filter>
  </defs>
  <rect width="298" height="84" fill="url(#warm)"/>
  <rect width="298" height="84" filter="url(#grain)"/>
</svg>
